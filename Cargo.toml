[workspace]
members = [
    ".",
    "tests/test_plugin",
    "crates/cloudflare-shell",
    "crates/cloudflare-shell-workspace",
    "crates/cloudflare-shell-rpc/types",
    "crates/cloudflare-shell-rpc/server",
    "crates/cloudflare-shell-rpc/client",
    "crates/cloudflare-shell-rpc/demo-rust",
]

# Common deps shared across crates/cloudflare-shell{,-workspace} and
# the four new crates under crates/cloudflare-shell-rpc/. Each member
# uses `<dep>.workspace = true` instead of repeating the version. The
# top-level http-nu crate keeps its own dep table for now -- its
# version pins are entangled with optional / conditional features.
[workspace.dependencies]
worker = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
base64 = "0.22"
console_error_panic_hook = "0.1"
futures-util = "0.3"

[package]
name = "http-nu"
version = "0.16.1-dev"
edition = "2021"
rust-version = "1.88.0"
description = "The surprisingly performant, Nushell-scriptable, cross.stream-powered, Datastar-ready HTTP server that fits in your back pocket."
license = "MIT"
repository = "https://github.com/cablehead/http-nu"
readme = "README.md"
homepage = "https://github.com/cablehead/http-nu"
keywords = ["http", "nushell", "server", "cli", "http-server"]
categories = ["web-programming", "command-line-utilities"]

[[bin]]
name = "http-nu"
path = "src/main.rs"
required-features = ["desktop"]

# rlib for the desktop binary; cdylib for worker-build / wasm-pack output.
# cdylib is harmless on desktop (extra .dylib artifact, never linked).
[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
clap = { version = "4", features = ["derive"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
http-serde = "2.1.1"

http = "1.1.0"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"], optional = true }
hyper-util = { version = "0.1", features = ["full", "server-auto"], optional = true }
# tokio narrowed to wasm-portable subset; desktop adds `full` via the cascade.
tokio = { version = "1", default-features = false, features = ["sync", "rt", "macros", "io-util", "time"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io", "compat"] }
futures-util = "0.3"

bytes = "1.6.0"
url = "2.5.0"

# nu-* crates: features made explicit so the wasm build can opt out of
# `os` (which pulls os_pipe). Desktop behavior is unchanged: the `desktop`
# feature below cascades the same effective feature set that was implicit
# before.
nu-cli = { version = "0.112.1", optional = true }
nu-cmd-lang = { version = "0.112.1", default-features = false }
nu-cmd-extra = { version = "0.112.1", default-features = false }
nu-command = { version = "0.112.1", default-features = false }
nu-engine = { version = "0.112.1", default-features = false }
nu-parser = { version = "0.112.1", default-features = false }
nu-plugin-engine = { version = "0.112.1", optional = true }
nu-protocol = { version = "0.112.1", default-features = false }
ctrlc = { version = "3.4", optional = true }
arc-swap = "1.7"
rustls = { version = "0.23.28", features = ["aws_lc_rs"], optional = true }
rustls-pemfile = { version = "2.1.0", optional = true }
tokio-rustls = { version = "0.26.0", optional = true }
scru128 = { version = "3", features = ["serde"] }
miette = "7"
crossterm = { version = "0.29", optional = true }
chrono = "0.4"
ipnet = "2"
tower-http = { version = "0.6.6", features = ["fs"], optional = true }
tower = { version = "0.5.2", features = ["util"], optional = true }
brotli = "8"
http_encoding_headers = "0.2.0"
headers = "0.4.1"
minijinja = { version = "2", features = ["json", "urlencode", "loop_controls", "loader"] }
v_htmlescape = "0.15"
nu-std = { version = "0.112.1", default-features = false }
nu-utils = { version = "0.112.1", default-features = false }
typetag = "0.2"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
# default features pull `regex-onig` (C oniguruma, no wasm32). regex-fancy
# is the pure-Rust backend; works on both targets.
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "default-syntaxes", "default-themes", "regex-fancy", "html", "plist-load", "yaml-load", "dump-load", "dump-create"] }
syntect-assets = { version = "0.23.6", default-features = false, features = ["regex-fancy"] }
pulldown-cmark = "0.12.2"
notify = { version = "8", optional = true }

# CF Workers runtime (gated by the `cloudflare` feature)
worker = { version = "0.8", optional = true }
# Backend-agnostic FileSystem trait + types. Path dep today; could
# move to a registry version if we publish it. Optional because
# desktop builds don't need it.
cloudflare-shell = { version = "0.1.0", path = "crates/cloudflare-shell", features = ["workers"], optional = true }
# DurableObject + R2 impl of cloudflare-shell::FileSystem. Wasm-only
# (depends on `worker` unconditionally); gated by target_arch below.

[dependencies.cross-stream]
version = "0.12.0"
optional = true

[features]
# `cloudflare` enables the worker-rs entrypoint (src/cf/) and pulls the
# Workers SDK. Build with: `cargo build --target wasm32-unknown-unknown
# --no-default-features --features cloudflare` (or via worker-build).
#
# nu-command/js enables JS-environment-friendly versions of commands
# that would otherwise need `os`. Matches nu-on-web's wasm recipe.
# Transitively enables `rand` (random integer etc) + getrandom/wasm_js.
# nu-command/sqlite is NOT here -- libsqlite3-sys needs a C toolchain
# we don't have for wasm32. `stor` examples need a CF-side shadow over
# ctx.storage.sql; tracked in the gap list below.
cloudflare = ["dep:worker", "dep:cloudflare-shell", "nu-command/js"]
# `desktop` cascades the nu-* feature set that http-nu has always used.
# Splitting it out lets a future `cloudflare` feature opt out of `os` (which
# pulls os_pipe, no wasm32 support) and opt into `js` for nu-command.
default = ["desktop", "cross-stream"]
desktop = [
    # desktop-only optional crates
    "dep:nu-cli",
    "dep:nu-plugin-engine",
    "dep:hyper",
    "dep:hyper-util",
    "dep:ctrlc",
    "dep:notify",
    "dep:rustls",
    "dep:rustls-pemfile",
    "dep:tokio-rustls",
    "dep:crossterm",
    "dep:tower",
    "dep:tower-http",
    # tokio runs as a real multi-threaded async runtime on desktop.
    "tokio/full",
    # crates that *have* an `os` feature (verified via crates.io 0.112.1)
    "nu-cmd-lang/os",
    "nu-command/os",
    "nu-command/network",
    "nu-command/rustls-tls",
    "nu-command/sqlite",
    "nu-engine/os",
    "nu-protocol/os",
    "nu-protocol/plugin",
    "nu-utils/os",
    # nu-cmd-extra, nu-parser, nu-std have no `os` feature; nothing to cascade.
]

[target.'cfg(windows)'.dependencies]
win_uds = "=0.2.2"

# Wasm32 needs `getrandom/wasm_js` to provide entropy. Desktop uses OS-level
# randomness via the default backend, untouched by this target-specific dep.
# console_error_panic_hook + uuid/js are also wasm-only essentials.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
uuid = { version = "1", features = ["js"] }
console_error_panic_hook = "0.1"
# Workspace impl. Pulled only on wasm because it depends unconditionally
# on `worker` (which is itself wasm-only). The actual gate that decides
# whether to USE it lives on `feature = "cloudflare"` at the call sites.
cloudflare-shell-workspace = { version = "0.1.0", path = "crates/cloudflare-shell-workspace" }

[build-dependencies]
syntect = "5.3.0"
cargo_metadata = "0.18"


[profile.release]
lto = true
codegen-units = 1

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/http-nu-v{ version }-{ target-family }.tar.gz"
bin-dir = "http-nu-v{ version }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/http-nu-v{ version }-linux-amd64.tar.gz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/http-nu-v{ version }-linux-amd64.tar.gz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/http-nu-v{ version }-linux-arm64.tar.gz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/http-nu-v{ version }-linux-arm64.tar.gz"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/http-nu-v{ version }-darwin-arm64.tar.gz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/http-nu-v{ version }-windows-amd64.tar.gz"

[package.metadata.binstall.overrides.x86_64-pc-windows-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/http-nu-v{ version }-windows-amd64.tar.gz"

[dev-dependencies]
tempfile = "3.10.1"
assert_cmd = "2.0"
predicates = "3"
nix = { version = "0.30", features = ["signal", "process"] }
sysinfo = "0.30.12"
brotli = "8"
minijinja = "2"





