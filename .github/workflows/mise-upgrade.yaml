name: Mise upgrade

# Weekly auto-PR that bumps pinned tool versions in mise.toml via
# `mise run mise:upgrade` (provided by joeblew999/.github tasks/mise.toml).
# Bump the @ref together with the lib pins in mise.toml.

on:
  schedule:
    - cron: '0 9 * * 1'   # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  upgrade:
    uses: joeblew999/.github/.github/workflows/reusable-mise-upgrade.yml@v0.19.2
