name: mise CI

# joeblew999-branch CI — runs `mise run ci` via the shared reusable
# workflow at joeblew999/.github. Does not touch cablehead's upstream
# ci.yml / release-binaries.yml; that fires on `main` only.
#
# Bump the @ref together with the `?ref=` pins in mise.toml's
# [task_config].includes when bumping the lib version.

on:
  push:
    branches: [joeblew999]
  pull_request:
    branches: [joeblew999]
  workflow_dispatch:

jobs:
  ci:
    uses: joeblew999/.github/.github/workflows/reusable-mise-ci.yml@v0.19.2
    with:
      # task: ci  (default — kept implicit to follow the convention)
      os-matrix: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      sccache: true
      cargo-lock-path: Cargo.lock
