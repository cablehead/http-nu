# Rust is owned by rustup via THIS file -- never mise (mise would export
# RUSTUP_TOOLCHAIN and override it). GitHub runners ship rustup; this pins the
# channel they use. `ci:check-global` enforces that rust stays out of [tools].
#
# 1.93.1 is the MSRV of the embedded Nushell engine (nu-* crates 0.113.1).
[toolchain]
channel = "1.93.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
