# housekeeping (DESTRUCTIVE -- prompts to confirm)
# ============================================================================

[tasks.clean]
description = "Remove cargo target/ only (DESTRUCTIVE, prompts to confirm)"
confirm = "Run 'cargo clean'? This deletes target/ — say no if unsure."
run = "cargo clean"

[tasks."clean:store"]
description = "Delete the local store dir at $STORE (DESTRUCTIVE, prompts to confirm)"
confirm = "Delete $STORE and everything in it? This is NOT recoverable."
run = '''
set -euo pipefail
: "${STORE:?STORE not set}"
case "$STORE" in
  ""|"/"|"."|"./"|".."|"../"|"$HOME"|"$HOME/")
    echo "refusing to delete suspicious STORE='$STORE'" >&2
    exit 1
    ;;
esac
[ -d "$STORE" ] || { echo "no $STORE to remove"; exit 0; }
rm -rf -- "$STORE"
echo "removed $STORE"
'''
