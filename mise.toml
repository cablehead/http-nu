[settings]
# extends task-inheritance is mise experimental — required by the
# joeblew999/.github shared task lib (ci:_base, rust:_base, etc.).
experimental = true

[task_config]
# Shared TOML task library from joeblew999/.github. Per-task tool pins
# (gh, jq, fnox, nu) propagate from the lib; consumers don't pin them
# globally. Tag bumps -> see https://github.com/joeblew999/.github/blob/main/CHANGELOG.md
includes = [
  "git::https://github.com/joeblew999/.github.git//tasks/ci.toml?ref=v0.58.0",
  "git::https://github.com/joeblew999/.github.git//tasks/mise.toml?ref=v0.58.0",
  "git::https://github.com/joeblew999/.github.git//tasks/tool-rust.toml?ref=v0.58.0",
  "git::https://github.com/joeblew999/.github.git//tasks/tool-cf.toml?ref=v0.58.0",
  "git::https://github.com/joeblew999/.github.git//tasks/tool-wrangler.toml?ref=v0.58.0",
]

[tools]
# Repo-specific tools only -- global tools (fnox/gh/jq/usage/git-cliff) come from
# `mise run mise:global:bootstrap`, and Rust is owned by rust-toolchain.toml
# (rustup), NEVER here -- `ci:check-global` enforces both.
"github:nushell/nushell" = "0.113"   # per-repo override: MUST match the embedded engine (nu-* crates 0.113.1)
# push-demo tooling (from push-native): cloudflared quick tunnel + resvg icon rendering.
"aqua:cloudflare/cloudflared" = "latest"
"cargo:resvg"            = "latest"
# email-native: wrangler from npm. The email:worker:* tasks call `wrangler`
# directly and rely on this global pin (the cedar cf:* tasks pin their own
# wrangler per-task, which overrides this).
"npm:wrangler"           = "4.71.0"

[env]
# CI_OS_MATRIX is read by mise:repo:bootstrap and projected into the generated
# workflow stub; setting it here keeps re-bootstrap from clobbering the override.
CI_OS_MATRIX     = '["ubuntu-latest", "macos-latest", "windows-latest"]'
CARGO_TERM_COLOR = "always"
PORT = "3001"
STORE = "./.store"
HTTP_NU = "./target/debug/http-nu"


# ============================================================================
# build
# ============================================================================

[tasks.build]
description = "Build debug binary"
sources = [
  "src/**/*.rs",
  "crates/*/src/**/*.rs",
  "crates/*/Cargo.toml",
  "build.rs",
  "Cargo.toml",
  "Cargo.lock",
]
outputs = ["target/debug/http-nu"]
run = "cargo build"

[tasks."build:release"]
description = "Build the http-nu binary (release) -- what CI ships"
sources = ["src/**/*.rs", "build.rs", "Cargo.toml", "Cargo.lock"]
outputs = ["target/release/http-nu"]
run = "cargo build --release --bin http-nu"

[tasks."build:plugin"]
description = "Build the nu_plugin_test binary used by cargo test"
sources = ["tests/test_plugin/**/*.rs", "tests/test_plugin/Cargo.toml"]
outputs = ["target/debug/nu_plugin_test"]
run = "cargo build -p nu_plugin_test"


# ============================================================================
# format / lint
# ============================================================================

[tasks.fmt]
description = "Apply rustfmt"
run = "cargo fmt --all"

[tasks."fmt:check"]
description = "Verify formatting without writing"
run = "cargo fmt --check --all"

[tasks.clippy]
description = "Clippy with -D warnings -W uninlined_format_args"
run = "cargo clippy --locked --workspace --all-targets --all-features -- -D warnings -W clippy::uninlined_format_args"


# ============================================================================
# test
# ============================================================================

[tasks.test]
description = "Run cargo test across the whole workspace (http-nu + cloudflare-shell + cloudflare-shell-workspace + test plugin)"
depends = ["build:plugin"]
run = "cargo test --workspace"

[tasks."test:nu"]
description = "Run nushell test scripts (router, html, datastar)"
depends = ["build"]
run = [
  "nu tests/test_router.nu",
  "nu tests/test_html.nu",
  "nu tests/test_datastar.nu",
]

[tasks."test:tao"]
description = "Run the Tao eval test"
depends = ["build"]
run = "$HTTP_NU eval examples/tao/test.nu"

# Local extension of the shared `ci` umbrella (ci:check-global + ci:check-nu
# from joeblew999/.github tasks/ci.toml). mise MERGES the depends, so the shared
# guards still run -- this only adds the repo's native build + test set. CF/wasm
# and wrangler tasks are intentionally excluded (they need extra targets/daemons).
[tasks.ci]
description = "CI -- shared guards (merged) + this repo's native build/test"
depends = ["test:nu", "fmt:check", "clippy", "test", "test:tao"]


# ============================================================================
# run (interactive)
# ============================================================================

[tasks.run]
description = "Run http-nu (pass args after --, e.g. mise run run -- :3001 examples/basic.nu)"
depends = ["build"]
run = "$HTTP_NU"


# ============================================================================
# examples (desktop)
# ============================================================================
# All listen on :$PORT (default 3001). Override: PORT=4000 mise run ex:basic
# Store-using examples write to $STORE (default ./.store).

[tasks."ex:hub"]
description = "All examples under one server (datastar + store)"
depends = ["build"]
run = "$HTTP_NU --datastar --store $STORE :$PORT examples/serve.nu"

[tasks."ex:basic"]
description = "Minimal routes, JSON, streaming, POST echo"
depends = ["build"]
run = "$HTTP_NU :$PORT examples/basic.nu"

[tasks."ex:stor"]
description = "In-memory SQLite via stor commands"
depends = ["build"]
run = "$HTTP_NU :$PORT examples/stor.nu"

[tasks."ex:blog"]
description = "Routing, layouts, HTML composition"
depends = ["build"]
run = "$HTTP_NU :$PORT examples/blog/serve.nu"

[tasks."ex:cargo-docs"]
description = "Browse cargo docs"
depends = ["build"]
run = "$HTTP_NU :$PORT examples/cargo-docs/serve.nu"

[tasks."ex:datastar-counter"]
description = "Datastar reactive counter"
depends = ["build"]
run = "$HTTP_NU --datastar :$PORT examples/datastar-counter/serve.nu"

[tasks."ex:datastar-sdk"]
description = "Datastar SDK feature demo"
depends = ["build"]
run = "$HTTP_NU --datastar :$PORT examples/datastar-sdk/serve.nu"

[tasks."ex:mermaid-editor"]
description = "Live Mermaid diagram editor"
depends = ["build"]
run = "$HTTP_NU --datastar :$PORT examples/mermaid-editor/serve.nu"

[tasks."ex:templates"]
description = ".mj file, inline, and topic modes (needs store)"
depends = ["build"]
run = "$HTTP_NU --datastar --store $STORE :$PORT examples/templates/serve.nu"

[tasks."ex:quotes"]
description = "Live quotes board with SSE (needs store)"
depends = ["build"]
run = "$HTTP_NU --datastar --store $STORE :$PORT examples/quotes/serve.nu"

[tasks."ex:tao"]
description = "The Tao of Datastar (--dev -w)"
depends = ["build"]
run = "$HTTP_NU --datastar --dev -w :$PORT examples/tao/serve.nu"

[tasks."ex:2048"]
description = "Solo 2048 driven by .bus pub / .bus sub"
depends = ["build"]
run = "$HTTP_NU --datastar :$PORT examples/2048/serve.nu"


# ============================================================================
# Cloudflare Workers (src/cf/)
# ============================================================================
# CF code lives in src/cf/, additive to upstream's src/ tree. Build runs
# from repo root (where Cargo.toml is); wrangler runs from src/cf/ (where
# wrangler.toml is). mise abstracts the cwd dance.
#
# See CLOUDFLARE.md for the full status, what each example does on CF,
# and the overall design.

[tasks."cf:build"]
description = "Build the http-nu Workers cdylib via worker-build. CF_HANDLER_PATH (relative to src/cf/) picks the embedded example; defaults to examples/blog/serve.nu. Set CF_BUILD_MODE=release for an optimised build (slower, what cf:deploy uses); defaults to dev for fast local iteration."
dir = "{{config_root}}"
tools = { "cargo:worker-build" = "^0.8" }
run = '''
#!/usr/bin/env nu
$env.CF_HANDLER_PATH = ($env.CF_HANDLER_PATH? | default "../../examples/blog/serve.nu")
let mode = ($env.CF_BUILD_MODE? | default "dev")
print $"embedding handler: ($env.CF_HANDLER_PATH)  (mode: ($mode))"
# Builds only http-nu: the workspace has no default-members, so worker-build
# at the root resolves to the root package alone (no plugin feature unification
# that would pull os-only crates into the wasm build). See Cargo.toml note.
match $mode {
  "dev" => {
    # --dev skips wasm-opt and uses cargo debug profile -> ~5-10s incremental
    # rebuilds vs ~30-45s for release.
    ^worker-build --dev -- --no-default-features --features cloudflare
  }
  "release" => {
    ^worker-build --release -- --no-default-features --features cloudflare
  }
  _ => {
    error make {msg: $"CF_BUILD_MODE=($mode) invalid -- use dev or release"}
  }
}
let wasm = (glob build/**/*.wasm | first)
if ($wasm | is-not-empty) {
  print ""
  let size = (^du -h $wasm | str trim | split row "\t" | first)
  print $"built  ($wasm) (($size))"
}
'''

[tasks."cf:dev"]
description = "Run the http-nu Worker locally via wrangler dev (no auth needed). Uses CF_HANDLER_PATH from cf:build."
depends = ["cf:build"]
dir = "{{config_root}}/src/cf"
tools = { "npm:wrangler" = "4.90", node = "22" }
run = "wrangler dev"

[tasks."cf:deploy"]
description = "Deploy the http-nu Worker to Cloudflare (requires CLOUDFLARE_API_TOKEN). Forces release-mode build via cf:build's CF_BUILD_MODE env."
depends = ["cf:token-check"]
dir = "{{config_root}}/src/cf"
tools = { "npm:wrangler" = "4.90", node = "22" }
run = '''
#!/usr/bin/env nu
$env.CLOUDFLARE_API_TOKEN = ($env.CLOUDFLARE_API_TOKEN? | default (^fnox get CLOUDFLARE_API_TOKEN | str trim))
$env.CF_BUILD_MODE = "release"
^mise run cf:build
^wrangler deploy
'''

[tasks."cf:tail"]
description = "Live-tail logs from the deployed http-nu Worker (wrangler tail; requires CLOUDFLARE_API_TOKEN)"
depends = ["cf:token-check"]
dir = "{{config_root}}/src/cf"
tools = { "npm:wrangler" = "4.90", node = "22" }
run = '''
#!/usr/bin/env nu
$env.CLOUDFLARE_API_TOKEN = ($env.CLOUDFLARE_API_TOKEN? | default (^fnox get CLOUDFLARE_API_TOKEN | str trim))
^wrangler tail
'''

[tasks."ex:cf:blog"]
description = "examples/blog on CF -- works end-to-end (router DSL, HTML DSL, content-type)"
dir = "{{config_root}}"
run = "CF_HANDLER_PATH=../../examples/blog/serve.nu mise run cf:dev"

[tasks."ex:cf:cargo-docs"]
description = "examples/cargo-docs on CF -- pair with `mise run cf:seed:cargo-docs` to populate target/doc/ in the workspace; then /cargo-docs/ renders the rustdoc index + per-crate pages"
dir = "{{config_root}}"
run = "CF_HANDLER_PATH=../../examples/cargo-docs/serve.nu mise run cf:dev"

[tasks."ex:cf:basic"]
description = "examples/basic on CF -- all routes work. /time bounded by the sleep-cap guard (returns ~64 timestamps before the no-op-sleep generator is shut down)"
dir = "{{config_root}}"
run = "CF_HANDLER_PATH=../../examples/basic.nu mise run cf:dev"

[tasks."ex:cf:2048"]
description = "examples/2048 on CF -- home page renders; gameplay (.append/.cat/.bus sub) needs cross-stream + bus wasm ports. See src/cf/nu/nu_command/xs/PLAN.md."
dir = "{{config_root}}"
run = "CF_HANDLER_PATH=../../examples/2048/serve.nu mise run cf:dev"

[tasks."ex:cf:workspace-browser"]
description = "Per-user Workspace file browser. Each first URL segment is a user; their files are isolated in DO SQLite via the http-nu Rust port of @cloudflare/shell."
dir = "{{config_root}}"
run = "CF_HANDLER_PATH=../../examples/cf-workspace-browser/serve.nu mise run cf:dev"

# All remaining examples have a CF entry too -- whether they work end-to-end
# is captured in CLOUDFLARE_STATUS.md. New demos that fail at parse time
# leave behind a clear panic; the CF/desktop parity check is "does the
# desktop demo also pass?".

[tasks."ex:cf:datastar-counter"]
description = "examples/datastar-counter on CF -- reactive counter via SSE"
dir = "{{config_root}}"
run = "CF_HANDLER_PATH=../../examples/datastar-counter/serve.nu mise run cf:dev"

[tasks."ex:cf:datastar-sdk"]
description = "examples/datastar-sdk on CF -- Datastar SDK feature demo"
dir = "{{config_root}}"
run = "CF_HANDLER_PATH=../../examples/datastar-sdk/serve.nu mise run cf:dev"

[tasks."ex:cf:mermaid-editor"]
description = "examples/mermaid-editor on CF -- live Mermaid diagram editor"
dir = "{{config_root}}"
run = "CF_HANDLER_PATH=../../examples/mermaid-editor/serve.nu mise run cf:dev"

[tasks."ex:cf:tao"]
description = "examples/tao on CF -- The Tao of Datastar (needs `DEMO=tao mise run cf:seed:demo` for data.json + page.html + static)"
dir = "{{config_root}}"
run = "CF_HANDLER_PATH=../../examples/tao/serve.nu mise run cf:dev"

# ex:cf:{templates,quotes,stor} -- omitted: their handlers reference
# commands not yet ported to wasm (.append/.last for templates+quotes,
# `stor *` for stor). See src/cf/nu/nu_command/xs/PLAN.md. Add them
# back here once the relevant ports land.

[tasks."ex:cf:datastar-sdk-test"]
description = "examples/datastar-sdk-test on CF -- Datastar SDK test runner"
dir = "{{config_root}}"
run = "CF_HANDLER_PATH=../../examples/datastar-sdk-test/serve.nu mise run cf:dev"


# ============================================================================
# CF hub -- wasm-clean desktop demos under one wrangler dev
# ============================================================================
# CF analogue of the desktop `ex:hub` flow. One worker bundle, one wrangler
# dev, all wasm-clean demos under /<demo-name>/...  Default DO unless URL
# uses /u/<user>/  (see CLOUDFLARE.md routing).
#
# Iteration loop:
#   mise run cf:dev:hub          # terminal 1 -- ~30s first build, then live
#   mise run cf:rebuild:hub      # terminal 2 -- ~5-15s incremental, wrangler hot-reloads
#   DEMO=mermaid-editor mise run cf:seed:demo    # for asset-dependent demos
#
# Known limitations:
# - `source X.nu` is resolved at Nu parse time and can't see std::fs on wasm,
#   so we run the hub through scripts/bundle-cf-handler.nu which textually
#   inlines source directives recursively.
# - Demos that need `.bus sub`, `.append`/`.last`, or `stor *` aren't in the
#   hub -- see src/cf/nu/nu_command/xs/PLAN.md.

[tasks."cf:bundle:hub"]
description = "Pre-resolve `source X.nu` directives in examples/serve-cf.nu so the result is self-contained. Nu's parser resolves source via std::fs which doesn't exist on wasm; this textual inline lets the hub work as the CF handler. serve-cf.nu is the CF-tailored hub -- mounts only demos that work on wasm (skips stor / templates / quotes pending xs port). Desktop hub remains examples/serve.nu."
dir = "{{config_root}}"
sources = ["examples/**/*.nu", "scripts/bundle-cf-handler.nu"]
outputs = ["target/cf-hub.nu"]
run = '''
#!/usr/bin/env nu
mkdir target
^nu scripts/bundle-cf-handler.nu examples/serve-cf.nu | save --force target/cf-hub.nu
'''

[tasks."cf:dev:hub"]
description = "Run the wasm-clean examples hub on CF (bundled examples/serve-cf.nu). All demos under /<demo-name>/... at the default DO. Iteration: keep this running, run `mise run cf:rebuild:hub` in another terminal -- wrangler hot-reloads on wasm changes (~10s). Seed asset-dependent demos via `DEMO=<name> mise run cf:seed:demo`."
dir = "{{config_root}}"
depends = ["cf:bundle:hub"]
# Inline-export rather than `env = {}` -- mise's task-table env does NOT
# propagate to depended-on tasks (cf:build sees its own fallback otherwise).
run = "CF_HANDLER_PATH=../../target/cf-hub.nu mise run cf:dev"

[tasks."cf:bench:local"]
description = "Benchmark the local wrangler dev (must be running) with oha. Defaults to the hub home (10s, 50 connections). Override: PATH=/basic/hello DURATION=30s CONNECTIONS=100 mise run cf:bench:local."
dir = "{{config_root}}"
tools = { "cargo:oha" = "1.10" }
run = '''
#!/usr/bin/env nu
let path_arg = ($env.PATH_ARG? | default "/")
let duration = ($env.DURATION? | default "10s")
let connections = ($env.CONNECTIONS? | default "50")
^nu benchmarks/bench-cf/run.nu --url "http://127.0.0.1:8787" --path $path_arg --duration $duration --connections $connections --label $"local: ($path_arg)" --save
'''

[tasks."cf:bench:report"]
description = "Regenerate benchmarks/bench-cf/REPORT.md from results.nuon. Shows latest snapshot, rolling averages, and last 20 runs."
dir = "{{config_root}}"
run = "nu benchmarks/bench-cf/report.nu --save"

[tasks."cf:bench:remote"]
description = "Benchmark the live worker with oha. Hits https://http-nu-cf.gedw99.workers.dev by default; set LIVE_BASE=... to point elsewhere. Override: PATH=/basic/hello DURATION=30s CONNECTIONS=100 mise run cf:bench:remote."
dir = "{{config_root}}"
tools = { "cargo:oha" = "1.10" }
run = '''
#!/usr/bin/env nu
let live_base = ($env.LIVE_BASE? | default "https://http-nu-cf.gedw99.workers.dev")
let path_arg = ($env.PATH_ARG? | default "/")
let duration = ($env.DURATION? | default "10s")
let connections = ($env.CONNECTIONS? | default "50")
^nu benchmarks/bench-cf/run.nu --url $live_base --path $path_arg --duration $duration --connections $connections --label $"remote: ($path_arg)" --save
'''

[tasks."cf:rebuild:hub"]
description = "Re-bundle examples/serve-cf.nu + rebuild wasm (dev mode). Use this from a second terminal while `cf:dev:hub` is running -- wrangler dev hot-reloads when the wasm changes. ~5-15s typical (incremental cargo rebuild)."
dir = "{{config_root}}"
depends = ["cf:bundle:hub"]
run = "CF_HANDLER_PATH=../../target/cf-hub.nu mise run cf:build"

[tasks."cf:deploy:hub"]
description = "Deploy the CF hub to the live worker AND seed asset-dependent demos. Wraps `cf:deploy` with hub-specific bundling + post-deploy seeding. Live URL: https://http-nu-cf.gedw99.workers.dev/"
dir = "{{config_root}}"
depends = ["cf:bundle:hub"]
run = '''
#!/usr/bin/env nu
$env.CF_HANDLER_PATH = "../../target/cf-hub.nu"
^mise run cf:deploy

# Seed asset-dependent demos against the live worker so first-time
# visitors get a working page without manual seeding.
let live_base = ($env.LIVE_BASE? | default "https://http-nu-cf.gedw99.workers.dev")
for d in ["mermaid-editor"] {
  print $"seeding ($d) into ($live_base)"
  with-env {BASE: $live_base, DEMO: $d} { ^mise run cf:seed:demo }
}
'''

[tasks."cf:wipe"]
description = "Wipe the local wrangler dev's Workspace (the default DO unless WS_USER=<user> selects a per-user DO via /u/<user>/). Useful when re-seeding or recovering."
dir = "{{config_root}}"
run = '''
#!/usr/bin/env nu
let base = ($env.BASE? | default "http://127.0.0.1:8787")
let ws_user = ($env.WS_USER? | default "")
let prefix = (if ($ws_user | is-not-empty) { $"/u/($ws_user)" } else { "" })

let reachable = (do -i { ^curl -s -o /dev/null --connect-timeout 1 $"($base)($prefix)/_workspace/ls?path=/" } | complete | get exit_code) == 0
if not $reachable {
  error make {msg: $"($base) not reachable -- start mise run cf:dev:hub first"}
}
# `_workspace/rm` is recursive + force. Wipe top-level entries (not / itself).
let entries = (do -i { ^curl -fs $"($base)($prefix)/_workspace/ls?path=/" } | complete | get stdout | str trim)
let parsed = (if ($entries | is-empty) { [] } else { $entries | from json })
for entry in $parsed {
  print $"rm /($entry)"
  do -i { ^curl -fs -o /dev/null -X POST $"($base)($prefix)/_workspace/rm?path=/($entry)" }
}
print $"wiped ($base)($prefix)/*"
'''

[tasks."cf:seed:demo"]
description = "Upload one demo's assets into the local wrangler dev's default Workspace. Usage: DEMO=tao mise run cf:seed:demo (default DO). Set WS_USER=bob to seed a per-user DO via /u/bob/. Use this AFTER mise run ex:cf:<demo> is listening on :8787. Skips *.nu (already in wasm). BASE=http://127.0.0.1:8787 by default."
dir = "{{config_root}}"
run = '''
#!/usr/bin/env nu
let demo = ($env.DEMO? | default "")
if ($demo | is-empty) { error make {msg: "usage: DEMO=<demo-name> mise run cf:seed:demo"} }
let base = ($env.BASE? | default "http://127.0.0.1:8787")
let ws_user = ($env.WS_USER? | default "")
let prefix = (if ($ws_user | is-not-empty) { $"/u/($ws_user)" } else { "" })
let src = $"examples/($demo)"

if not ($src | path exists) { error make {msg: $"($src) not found"} }
let reachable = (do -i { ^curl -s -o /dev/null --connect-timeout 1 $"($base)($prefix)/_workspace/ls?path=/" } | complete | get exit_code) == 0
if not $reachable {
  error make {msg: $"($base) not reachable -- start mise run ex:cf:($demo) first"}
}

let files = (glob $"($src)/**/*" | where {|p| ($p | path type) == "file" })
mut count = 0
mut fail = 0
for file in $files {
  # Skip nu sources -- the handler is already in the wasm.
  if ($file | str ends-with ".nu") { continue }
  let rel = ($file | str replace $"($src)/" "")
  let mime = (do -i { ^file --brief --mime-type $file } | complete | get stdout | str trim | default "application/octet-stream")
  let mime = (if ($mime | is-empty) { "application/octet-stream" } else { $mime })
  let url = $"($base)($prefix)/_workspace/put?path=/($rel)"
  let http_code = (^curl -s -o /dev/null -w "%{http_code}" -X POST -H $"Content-Type: ($mime)" --data-binary $"@($file)" $url | str trim)
  if $http_code == "200" {
    $count = $count + 1
  } else {
    print --stderr $"($rel) (($http_code))"
    $fail = $fail + 1
  }
}

print $"seeded ($count) files from ($src) into ($base)($prefix)/"
if $fail != 0 { error make {msg: $"($fail) uploads failed"} }
'''

[tasks."cf:upload"]
description = "Generic: upload SRC (a directory) into the local wrangler dev's Workspace under DEST. Usage: SRC=target/doc DEST=/target/doc mise run cf:upload. Defaults: BASE=http://127.0.0.1:8787, default DO (set WS_USER=name for per-user via /u/<name>)."
dir = "{{config_root}}"
run = '''
#!/usr/bin/env nu
let src = ($env.SRC? | default "")
let dest_in = ($env.DEST? | default "")
if ($src | is-empty) or ($dest_in | is-empty) { error make {msg: "usage: SRC=<local-dir> DEST=<workspace-path> mise run cf:upload"} }
let base = ($env.BASE? | default "http://127.0.0.1:8787")
let ws_user = ($env.WS_USER? | default "")
let prefix = (if ($ws_user | is-not-empty) { $"/u/($ws_user)" } else { "" })

if not ($src | path exists) { error make {msg: $"($src) not found"} }
let reachable = (do -i { ^curl -s -o /dev/null --connect-timeout 1 $"($base)($prefix)/_workspace/ls?path=/" } | complete | get exit_code) == 0
if not $reachable {
  error make {msg: $"($base) not reachable -- start a wrangler dev first"}
}
# Normalise DEST: leading /, no trailing /.
let dest = ("/" + ($dest_in | str trim --left --char "/") | str trim --right --char "/")

let files = (glob $"($src)/**/*" | where {|p| ($p | path type) == "file" })
mut count = 0
mut fail = 0
for file in $files {
  let rel = ($file | str replace $"($src)/" "")
  let mime = (do -i { ^file --brief --mime-type $file } | complete | get stdout | str trim)
  let mime = (if ($mime | is-empty) { "application/octet-stream" } else { $mime })
  let url = $"($base)($prefix)/_workspace/put?path=($dest)/($rel)"
  let http_code = (^curl -s -o /dev/null -w "%{http_code}" -X POST -H $"Content-Type: ($mime)" --data-binary $"@($file)" $url | str trim)
  if $http_code == "200" {
    $count = $count + 1
  } else {
    print --stderr $"($rel) (($http_code))"
    $fail = $fail + 1
  }
}

print $"uploaded ($count) files from ($src) -> ($base)($prefix)($dest)/"
if $fail != 0 { error make {msg: $"($fail) uploads failed"} }
'''

[tasks."cf:seed:cargo-docs"]
description = "Build cargo doc for this workspace + upload target/doc/ to /target/doc/ in the local wrangler dev's Workspace. Pair with `mise run ex:cf:cargo-docs`."
dir = "{{config_root}}"
run = '''
#!/usr/bin/env nu
print "cargo doc --workspace --no-deps"
^cargo doc --workspace --no-deps --quiet
with-env {SRC: "target/doc", DEST: "/target/doc"} { ^mise run cf:upload }
'''



# ============================================================================
# nu-on-web (prior art for curated Nu in wasm; lives in .src/)
# ============================================================================
# Reference build patterns that nu-on-web uses (wasm-pack + svelte playground).
# .src/ is gitignored — these tasks operate against a cloned working copy.

[tasks."nu-on-web:clone"]
description = "Clone nu-on-web/nu-on-web into .src/ (idempotent)"
dir = "{{config_root}}"
run = '''
#!/usr/bin/env nu
mkdir .src
if (".src/nu-on-web/.git" | path exists) {
  print ".src/nu-on-web already present"
} else {
  ^git clone --depth 1 https://github.com/nu-on-web/nu-on-web.git .src/nu-on-web
}
'''

[tasks."nu-on-web:build"]
description = "Build nu-on-web wasm into its playground/src/wasm/ (dev)"
depends = ["nu-on-web:clone"]
dir = "{{config_root}}/.src/nu-on-web"
tools = { "cargo:wasm-pack" = "0.13" }
run = "wasm-pack build --dev --no-opt --no-pack --target web --out-dir playground/src/wasm"

[tasks."nu-on-web:prod"]
description = "Build nu-on-web wasm (release/optimized)"
depends = ["nu-on-web:clone"]
dir = "{{config_root}}/.src/nu-on-web"
tools = { "cargo:wasm-pack" = "0.13" }
run = "wasm-pack build --target web --no-pack --release --out-dir playground/src/wasm"

[tasks."nu-on-web:install"]
description = "Install nu-on-web playground npm deps"
depends = ["nu-on-web:clone"]
dir = "{{config_root}}/.src/nu-on-web/playground"
tools = { node = "22" }
run = "npm install"

[tasks."nu-on-web:dev"]
description = "Run nu-on-web playground dev server (Vite); auto-builds wasm + npm install first"
depends = ["nu-on-web:build", "nu-on-web:install"]
dir = "{{config_root}}/.src/nu-on-web/playground"
tools = { node = "22" }
run = "npm run dev"


# ============================================================================
# housekeeping (DESTRUCTIVE -- prompts to confirm)
# ============================================================================

[tasks.clean]
description = "Remove cargo target/ only (DESTRUCTIVE, prompts to confirm)"
confirm = "Run 'cargo clean'? This deletes target/ — say no if unsure."
run = "cargo clean"

[tasks."clean:store"]
description = "Delete the local store dir at $STORE (DESTRUCTIVE, prompts to confirm)"
confirm = "Delete $STORE and everything in it? This is NOT recoverable."
run = '''
#!/usr/bin/env nu
let store = ($env.STORE? | default "")
if ($store | is-empty) { error make {msg: "STORE not set"} }
let home = $nu.home-dir
let suspicious = ["" "/" "." "./" ".." "../" $home $"($home)/"]
if ($store in $suspicious) {
  error make {msg: $"refusing to delete suspicious STORE='($store)'"}
}
if not ($store | path exists) {
  print $"no ($store) to remove"
  return
}
rm -rf $store
print $"removed ($store)"
'''

