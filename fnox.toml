# Per-repo fnox config for email-native. Secrets and per-deploy config live
# in the macOS keychain under repo-prefixed item names (HTTP_NU_EMAIL_*) so
# this repo's CF tokens don't collide with -- or shadow -- other repos using
# the same fnox service. See [[feedback_cloud_project_per_repo]]: one CF
# project + one keychain item per repo, no token reuse "to save a step".
#
# The LEFT side of each entry is the env var name the code reads at runtime.
# The `value` is the keychain item name -- repo-scoped. mise tasks exec
# wrangler / the plugin under `fnox exec` so these resolve to env vars.

[providers.keychain]
type = "keychain"
service = "fnox"

[secrets]
# NOTE: CLOUDFLARE_API_TOKEN intentionally NOT prefixed here. The pragmatic
# pattern on this machine is one CF API token shared across repos (per the
# global ~/.config/fnox/config.toml). If you want a scoped per-repo token,
# change `value` below to "HTTP_NU_EMAIL_CLOUDFLARE_API_TOKEN" and store a
# narrower-scoped token under that keychain item. The [[feedback_cloud_project_per_repo]]
# memory recommends the latter; the former is what's wired right now so
# that mise tasks inherit the existing global token.
CLOUDFLARE_API_TOKEN = { provider = "keychain", value = "CLOUDFLARE_API_TOKEN" }

# Plugin <-> Worker bearer. Gates `POST /send` so only this repo's plugin
# can use the deployed Worker. Generated by `mise run email:secrets:generate`.
CF_EMAIL_AUTH_TOKEN = { provider = "keychain", value = "HTTP_NU_EMAIL_AUTH_TOKEN" }

# Worker -> http-nu webhook HMAC. Same generator task.
CF_EMAIL_WEBHOOK_HMAC_KEY = { provider = "keychain", value = "HTTP_NU_EMAIL_WEBHOOK_HMAC_KEY" }

# Deployed Worker URL. Set via `mise run email:worker:url-set -- <url>`
# after the first `wrangler deploy`.
CF_EMAIL_WORKER_URL = { provider = "keychain", value = "HTTP_NU_EMAIL_WORKER_URL" }

# Where the Worker POSTs inbound mail. Set to your http-nu deployment URL,
# e.g. https://http-nu.example.com/webhooks/email/inbound.
CF_EMAIL_WEBHOOK_URL = { provider = "keychain", value = "HTTP_NU_EMAIL_WEBHOOK_URL" }

# Sender domain (e.g. mail.example.com). Switching domains = fnox edit, no
# code change. Used by setup tasks and (eventually) by the demo handler to
# log "what address are we sending as".
CF_EMAIL_SENDER_DOMAIN = { provider = "keychain", value = "HTTP_NU_EMAIL_SENDER_DOMAIN" }

# Bearer token gating examples/email-demo's `POST /send` admin endpoint.
# Separate from CF_EMAIL_AUTH_TOKEN (which gates plugin -> Worker); this is
# the demo's "who can ask us to send" boundary.
EMAIL_ADMIN_TOKEN = { provider = "keychain", value = "HTTP_NU_EMAIL_ADMIN_TOKEN" }

# Recipient inbox for the half-automated smoke test in
# examples/email-demo/test/smoke.nu. Not a secret, but kept here so
# rotating to a different inbox is a `mise run email:test:recipient-set`
# call instead of editing source.
TEST_RECIPIENT_EMAIL = { provider = "keychain", value = "HTTP_NU_EMAIL_TEST_RECIPIENT_EMAIL" }
