# Per-repo fnox config. Secrets live in the macOS keychain (service = "fnox",
# matching the user's ~/.config/fnox/config.toml so it composes with their
# other repos). The LEFT side of each [secrets] entry is the env var name the
# code reads at runtime; `value` is the keychain item name. mise tasks run
# wrangler / the plugins under `fnox exec` so these resolve to env vars.
#
# - push-demo: `mise run push:vapid:generate` populates the VAPID_* items +
#   admin token via `fnox set -p keychain`; push-demo:serve / push-demo:dev
#   inject them at runtime.
# - email-native: CF + email secrets use repo-prefixed keychain item names
#   (HTTP_NU_EMAIL_*) so this repo's tokens don't collide with -- or shadow --
#   other repos sharing the same fnox service. See
#   [[feedback_cloud_project_per_repo]]: one CF project + one keychain item per
#   repo, no token reuse "to save a step".

[providers.keychain]
type = "keychain"
service = "fnox"

[secrets]
# Pre-existing; left as-is (inline-plaintext shape was already used here).
SHELL_FS_TOKEN= { value = "7e701003c51873747ae35aece0b6ca2f36f837384a61e4fa", default = "7e701003c51873747ae35aece0b6ca2f36f837384a61e4fa" }

# push-demo: all four go through the keychain provider so plaintext never
# lands in fnox.toml. Fresh clones must run `mise run push:vapid:generate`.
VAPID_PUBLIC_KEY= { provider = "keychain", value = "VAPID_PUBLIC_KEY" }
VAPID_PRIVATE_KEY= { provider = "keychain", value = "VAPID_PRIVATE_KEY" }
VAPID_SUBJECT= { provider = "keychain", value = "VAPID_SUBJECT" }
PUSH_ADMIN_TOKEN= { provider = "keychain", value = "PUSH_ADMIN_TOKEN" }

# email-native: CF + email secrets.
# CLOUDFLARE_API_TOKEN intentionally NOT prefixed -- the pragmatic pattern on
# this machine is one CF API token shared across repos (per the global
# ~/.config/fnox/config.toml). For a scoped per-repo token, change `value` to
# "HTTP_NU_EMAIL_CLOUDFLARE_API_TOKEN" and store a narrower token there.
CLOUDFLARE_API_TOKEN = { provider = "keychain", value = "CLOUDFLARE_API_TOKEN" }

# Plugin <-> Worker bearer. Gates `POST /send` so only this repo's plugin can
# use the deployed Worker. Generated by `mise run email:secrets:generate`.
CF_EMAIL_AUTH_TOKEN = { provider = "keychain", value = "HTTP_NU_EMAIL_AUTH_TOKEN" }

# Worker -> http-nu webhook HMAC. Same generator task.
CF_EMAIL_WEBHOOK_HMAC_KEY = { provider = "keychain", value = "HTTP_NU_EMAIL_WEBHOOK_HMAC_KEY" }

# Deployed Worker URL. Set via `mise run email:worker:url-set -- <url>` after
# the first `wrangler deploy`.
CF_EMAIL_WORKER_URL = { provider = "keychain", value = "HTTP_NU_EMAIL_WORKER_URL" }

# Where the Worker POSTs inbound mail. Set to your http-nu deployment URL,
# e.g. https://http-nu.example.com/webhooks/email/inbound.
CF_EMAIL_WEBHOOK_URL = { provider = "keychain", value = "HTTP_NU_EMAIL_WEBHOOK_URL" }

# Sender domain (e.g. mail.example.com). Switching domains = fnox edit, no
# code change.
CF_EMAIL_SENDER_DOMAIN = { provider = "keychain", value = "HTTP_NU_EMAIL_SENDER_DOMAIN" }

# Bearer token gating examples/email-demo's `POST /send` admin endpoint.
# Separate from CF_EMAIL_AUTH_TOKEN (which gates plugin -> Worker).
EMAIL_ADMIN_TOKEN = { provider = "keychain", value = "HTTP_NU_EMAIL_ADMIN_TOKEN" }

# Recipient inbox for the half-automated smoke test in
# examples/email-demo/test/smoke.nu. Not a secret, but kept here so rotating
# inboxes is a `mise run email:test:recipient-set` call, not a source edit.
TEST_RECIPIENT_EMAIL = { provider = "keychain", value = "HTTP_NU_EMAIL_TEST_RECIPIENT_EMAIL" }
